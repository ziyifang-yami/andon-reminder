# Default server (port 80, catch-all)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;
    server_name _;
    location / {
        try_files $uri $uri/ =404;
    }
}
# zbot.yamibuy.net -- redirect HTTP to HTTPS
server {
    listen 80;
    server_name zbot.yamibuy.net;
    return 301 https://$host$request_uri;
}
# zbot.yamibuy.net -- HTTPS
server {
    listen 443 ssl;
    server_name zbot.yamibuy.net;
    ssl_certificate     /etc/nginx/ssl/zbot.yamibuy.net.crt;
    ssl_certificate_key /etc/nginx/ssl/zbot.yamibuy.net.key;
    # Ticket redirect for WeCom links (no # in URL)
    location ~ ^/ticket/(.+)$ {
        return 302 https://central.yamibuy.net/wh-v2/index.html#/wh/andonCordDetail?ticketNo=$1;
    }
    location /oauth2callback {
        proxy_pass http://localhost:8000/oauth2callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /loc-recommendation {
        proxy_pass http://127.0.0.1:8510;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
    location /upc-check-price {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
